<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Order Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f6;margin:0;padding:20px}
.container{max-width:1400px;margin:auto;background:#fff;padding:20px;border-radius:10px}
.sidebar{display:flex;gap:10px;margin-bottom:20px}
.sidebar button{padding:10px 20px;border:none;background:#2c3e50;color:#fff;cursor:pointer}
.table-container{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border:1px solid #ddd}
th{background:#2c3e50;color:white}
.btn{padding:8px 12px;border:none;cursor:pointer;border-radius:5px}
.btn-add{background:#27ae60;color:white}
.btn-done{background:#3498db;color:white}
.online{background:#27ae60;color:white;padding:10px;position:fixed;bottom:20px;right:20px}
.offline{background:#e74c3c;color:white;padding:10px;position:fixed;bottom:20px;right:20px}
</style>
</head>
<body>
<div id="statusIndicator" class="online">ONLINE</div>

<div class="container">
<h2>Ultimate Order Manager</h2>

<div>
<input type="text" id="newEmployerName" placeholder="Employer Name">
<input type="number" id="employerRate" placeholder="Rate">
<button class="btn btn-add" onclick="saveEmployer()">Add Employer</button>
</div>

<div id="employer-tabs"></div>

<div style="display: flex; gap: 20px; margin-bottom: 20px;">
    <div style="flex: 1; background: #ebf5fb; border-left: 5px solid #3498db; padding: 20px; border-radius: 5px;">
        <h4 style="margin: 0; color: #3498db; font-size: 12px; text-transform: uppercase;">Pending Total</h4>
        <div id="pendingTotal" style="font-size: 24px; font-weight: bold; color: #3498db;">0.00</div>
    </div>
    <div style="flex: 1; background: #eafaf1; border-left: 5px solid #27ae60; padding: 20px; border-radius: 5px;">
        <h4 style="margin: 0; color: #27ae60; font-size: 12px; text-transform: uppercase;">Done Total</h4>
        <div id="doneTotal" style="font-size: 24px; font-weight: bold; color: #27ae60;">0.00</div>
    </div>
</div>

<div class="sidebar">
<button onclick="showTab('active-section')">Active</button>
<button onclick="showTab('done-section')">Completed</button>
<button onclick="showTab('history-section')">History</button>
</div>

<div id="active-section">
<h3>Register Order</h3>
<input type="text" id="client" placeholder="Client Name">
<input type="text" id="detail" placeholder="Task Detail">

<select id="type" onchange="adjustInputs()">
<option value="Pages">Pages</option>
<option value="Quiz">Quiz</option>
<option value="Midterm">Midterm</option>
<option value="PPT">PPT</option>
<option value="Infographic">Infographic</option>
<option value="Technical">Technical</option>
</select>

<input type="number" id="unit" value="1">
<div id="cppContainer">
<input type="number" id="cpp" value="300">
</div>
<input type="datetime-local" id="deadline">
<button class="btn btn-add" onclick="saveTask()">Register Order</button>
<div class="form-group">
    <label>Alarm Lead (Hours before)</label>
    <input type="number" id="alertLeadInput" value="1" min="1" step="0.5" style="width: 60px;">
</div>
<div id="alarm-controls" style="display:none; margin: 10px 0; padding: 15px; background: #fdf2f2; border: 2px solid #e74c3c; border-radius: 5px; text-align: center;">
    <p style="color: #e74c3c; font-weight: bold; margin: 0 0 10px 0;">🚨 URGENT: TASK DEADLINE REACHED 🚨</p>
    <button class="btn" onclick="stopAlarm()" style="background: #e74c3c; color: white; width: 100%; padding: 12px; font-size: 16px; font-weight: bold;">DISMISS ALARM</button>
</div>
<h3>Pending Orders</h3>
<div class="table-container">
<table>
<thead>
<tr>
<th>Client</th>
<th>Detail</th>
<th>Type</th>
<th>Units</th>
<th>CPP</th>
<th>Payable</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>
</div>

<div id="done-section" style="display:none">
    <h3>Completed Orders</h3>
    <table>
        <thead>
            <tr>
                <th>Client</th>
                <th>Detail</th>
                <th>Payable</th>
            </tr>
        </thead>
        <tbody id="doneTableBody"></tbody>
    </table>
    <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button class="btn btn-add" onclick="exportToExcel()" style="background:#27ae60">📊 Export Excel</button>
        <button class="btn btn-done" onclick="exportToWord()" style="background:#2c3e50">📄 Export Word</button>
    </div>
</div>

<div id="history-section" style="display:none">
<h3>History</h3>
<table>
<thead>
<tr>
<th>Client</th>
<th>Detail</th>
<th>Status</th>
</tr>
</thead>
<tbody id="historyBody"></tbody>
</table>
</div>
</div>

<audio id="dueAlarm" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"></audio>

<script>
const SUPABASE_URL='https://xzxpwbkjhazvsaxxgqws.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6eHB3YmtqaGF6dnNheHhncXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NDgzMjEsImV4cCI6MjA5MDAyNDMyMX0.RDfNx5pUUhm6dZKf_F1Ada3rH6-rVxdPnrYXcrwyZi0';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentEmployerId=null;
let currentEmployerRate=300;
let alarmInterval;

function showTab(tabId){
['active-section','done-section','history-section'].forEach(id=>{
document.getElementById(id).style.display=id===tabId?'block':'none';
});
}

function updateStatusUI(){
const el=document.getElementById('statusIndicator');
if(navigator.onLine){
el.className='online';
el.innerText='ONLINE';
}else{
el.className='offline';
el.innerText='OFFLINE';
}
}
window.addEventListener('online',updateStatusUI);
window.addEventListener('offline',updateStatusUI);

async function saveEmployer(){
const name=document.getElementById('newEmployerName').value.trim();
const rate=parseFloat(document.getElementById('employerRate').value)||300;
if(!name)return alert('Enter employer name');

const {data,error}=await supabaseClient
.from('employers')
.insert([{employer_name:name,rate_per_unit:rate}])
.select();

if(error)return alert(error.message);

currentEmployerId=data[0].id;
currentEmployerRate=rate;
loadEmployers();
}

async function loadEmployers(){
const {data}=await supabaseClient.from('employers').select('*');
const container=document.getElementById('employer-tabs');
container.innerHTML='';

data.forEach(emp=>{
const btn=document.createElement('button');
btn.innerText=emp.employer_name;
btn.onclick=()=>{
currentEmployerId=emp.id;
currentEmployerRate=emp.rate_per_unit;
fetchTasks();
};
container.appendChild(btn);
});
}

function adjustInputs(){
const type=document.getElementById('type').value;
const container=document.getElementById('cppContainer');

if(type==='Quiz'){
container.innerHTML='<input type="number" id="cpp" value="800">';
}
else if(type==='Midterm'){
container.innerHTML='<input type="number" id="cpp" value="1000">';
}
else if(type==='PPT'){
container.innerHTML='<input type="number" id="cpp" value="150">';
}
else if(type==='Infographic'){
container.innerHTML='<input type="number" id="cpp" value="1200">';
}
else if(type==='Technical'){
container.innerHTML='<input type="number" id="cpp" value="2000">';
}
else{
container.innerHTML=`<input type="number" id="cpp" value="${currentEmployerRate}">`;
}
}

async function saveTask(){
if(!currentEmployerId)return alert('Select employer first');

const task={
employer_id:currentEmployerId,
client_name:document.getElementById('client').value,
task_detail:document.getElementById('detail').value,
task_type:document.getElementById('type').value,
units:parseFloat(document.getElementById('unit').value),
cpp:parseFloat(document.getElementById('cpp').value),
payable:parseFloat(document.getElementById('unit').value)*parseFloat(document.getElementById('cpp').value),
deadline:document.getElementById('deadline').value,
status:'Pending',
notified:false
};

const alertHours = document.getElementById('alertLeadInput')?.value || 1; // Default to 1 if empty

const { data, error } = await supabaseClient
    .from('tasks')
    .insert([{
        client_name: client,
        task_detail: detail,
        task_type: type,
        units: units,
        cpp: cpp,
        payable: payable,
        deadline: deadline,
        alert_lead_hours: parseFloat(alertHours), // Save the user's preference
        employer_id: currentEmployerId,
        status: 'Pending'
    }]);

const {error}=await supabaseClient.from('tasks').insert([task]);
if(error)return alert(error.message);

fetchTasks();
clearInputs();
}

function clearInputs(){
document.getElementById('client').value='';
document.getElementById('detail').value='';
document.getElementById('unit').value=1;
document.getElementById('deadline').value='';
}

async function fetchTasks() {
    if (!currentEmployerId) return;

    try {
        const { data, error } = await supabaseClient
            .from('tasks')
            .select('*')
            .eq('employer_id', currentEmployerId)
            .order('created_at', { ascending: false });

        if (error) throw error;

        // CRITICAL: This is the line that makes the Blue/Green boxes calculate!
        updateDashboardTotals(data);

        renderActive(data.filter(t => t.status === 'Pending'));
        renderDoneTable(data.filter(t => t.status === 'Done'));
        renderHistory(data.filter(t => t.status === 'Paid' || t.status === 'Cancelled'));
        checkDeadlines(data.filter(t => t.status === 'Pending'));
    } catch (err) {
        console.error("Fetch error:", err.message);
    }
}

function renderActive(tasks){
const body=document.getElementById('tableBody');
body.innerHTML='';

tasks.forEach(task => {
    body.innerHTML += `
    <tr>
        <td>${task.client_name}</td>
        <td>${task.task_detail}</td>
        <td>${task.task_type}</td>
        <td>${task.units}</td>
        <td>${task.cpp}</td>
        <td>${task.payable}</td>
        <td class="time-countdown" data-deadline="${task.deadline}">Calculating...</td>
        <td><button class='btn btn-done' onclick="markAsDone('${task.id}')">Done</button></td>
    </tr>`;
});
}

function renderDoneTable(tasks) {
    const body = document.getElementById('doneTableBody');
    if (!body) return;
    
    body.innerHTML = '';
    let runningTotal = 0; // Renamed to avoid conflicts

    tasks.forEach(task => {
        const amt = parseFloat(task.payable) || 0;
        runningTotal += amt;
        
        body.innerHTML += `
        <tr>
            <td>${task.client_name}</td>
            <td>${task.task_detail}</td>
            <td style="text-align:right; font-weight:bold;">${amt.toLocaleString('en-KE', {minimumFractionDigits:2})}</td>
        </tr>`;
    });

    // Add the summary row at the bottom of the table
    if (tasks.length > 0) {
        body.innerHTML += `
        <tr style="background: #f9f9f9; font-weight: bold;">
            <td colspan="2" style="text-align: right;">Total KES:</td>
            <td style="text-align: right; color: #27ae60;">${runningTotal.toLocaleString('en-KE', {minimumFractionDigits:2})}</td>
        </tr>`;
    }
}

function renderHistory(tasks){
const body=document.getElementById('historyBody');
body.innerHTML='';

tasks.forEach(task=>{
body.innerHTML+=`
<tr>
<td>${task.client_name}</td>
<td>${task.task_detail}</td>
<td>${task.status}</td>
</tr>`;
});
}

async function markAsDone(id){
await supabaseClient
.from('tasks')
.update({status:'Done'})
.eq('id',id);

fetchTasks();
}

/** * PERFECTED ALARM ENGINE */
function checkDeadlines(tasks) {
    const now = new Date();
    
    for (let task of tasks) {
        if (!task.deadline) continue;
        
        const deadline = new Date(task.deadline);
        const diff = deadline - now;

        // Convert the stored hours into milliseconds
        // If alert_lead_hours is 2, leadTimeMS becomes 7,200,000
        const leadTimeMS = (task.alert_lead_hours || 1) * 3600000;

        // Trigger alarm if time remaining is less than your custom lead time
        if (diff < leadTimeMS && diff > 0 && !task.notified) {
            triggerAlarm(task);
            notifyUser(task);
            markNotified(task.id);
        }
    }
}

function triggerAlarm(task) {
    const alarm = document.getElementById('dueAlarm');
    const controls = document.getElementById('alarm-controls');
    
    // Show the visual stop button
    if (controls) controls.style.display = 'block';

    // Play sound and loop it every 5 seconds until stopped
    alarm.play().catch(e => console.log("Interaction required for audio"));
    
    if (!alarmInterval) {
        alarmInterval = setInterval(() => {
            alarm.currentTime = 0; // Restart sound
            alarm.play();
        }, 5000);
    }
}

function stopAlarm() {
    const alarm = document.getElementById('dueAlarm');
    const controls = document.getElementById('alarm-controls');

    // 1. Stop the sound
    clearInterval(alarmInterval);
    alarmInterval = null;
    alarm.pause();
    alarm.currentTime = 0;

    // 2. Hide the button
    if (controls) controls.style.display = 'none';
}

function notifyUser(task){
if(Notification.permission==='granted'){
new Notification('Task Due Soon',{body:task.task_detail});
}else if(Notification.permission!=='denied'){
Notification.requestPermission();
}
}

async function markNotified(id){
await supabaseClient
.from('tasks')
.update({notified:true})
.eq('id',id);
}

function generateExcelInvoice(){
const table=document.getElementById('doneTableBody');
let data=[];

Array.from(table.rows).forEach(row=>{
let rowData=[];
Array.from(row.cells).forEach(cell=>{
rowData.push(cell.innerText);
});
data.push(rowData);
});

const ws=XLSX.utils.aoa_to_sheet(data);
const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,'Invoice');
XLSX.writeFile(wb,'invoice.xlsx');
}

async function exportToExcel() {
    const tableBody = document.getElementById('doneTableBody');
    if (tableBody.rows.length === 0 || tableBody.rows[0].cells.length < 3) return alert("No completed orders to export!");

    const employerName = document.querySelector('#employer-tabs button[style*="background-color"]')?.innerText || "Employer";
    
    // Prepare Data
    let data = [
        ["INVOICE - " + employerName.toUpperCase()],
        ["Date:", new Date().toLocaleDateString()],
        [],
        ["CLIENT", "TASK DETAIL", "PAYABLE (KES)"]
    ];

    let total = 0;
    const taskIds = [];

    // Loop through current "Done" tasks in the UI
    const rows = Array.from(tableBody.querySelectorAll('tr:not([style*="font-weight: bold"])'));
    rows.forEach(row => {
        const client = row.cells[0].innerText;
        const detail = row.cells[1].innerText;
        const payableStr = row.cells[2].innerText.replace(/[^0-9.]/g, '');
        const amt = parseFloat(payableStr);
        
        data.push([client, detail, amt]);
        total += amt;
    });

    data.push([]);
    data.push(["", "TOTAL PAYABLE", total]);

    // Create Workbook
    const ws = XLSX.utils.aoa_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Invoice");
    
    XLSX.writeFile(wb, `Invoice_${employerName}_${Date.now()}.xlsx`);

    // Move to History
    await moveTasksToHistory();
}

async function exportToWord() {
    const tableBody = document.getElementById('doneTableBody');
    const rows = Array.from(tableBody.querySelectorAll('tr:not([style*="font-weight: bold"])'));
    if (rows.length === 0) return alert("No orders to export!");

    const { Document, Packer, Paragraph, Table, TableRow, TableCell, TextRun, WidthType, AlignmentType } = docx;

    const tableRows = [
        new TableRow({
            children: [
                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "DETAILS", bold: true })] })] }),
                new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "PAYABLE", bold: true })] })] }),
            ],
        }),
    ];

    let total = 0;
    rows.forEach(row => {
        const detail = row.cells[1].innerText;
        const payable = row.cells[2].innerText;
        total += parseFloat(payable.replace(/[^0-9.]/g, ''));

        tableRows.push(new TableRow({
            children: [
                new TableCell({ children: [new Paragraph(detail)] }),
                new TableCell({ children: [new Paragraph(payable)] }),
            ],
        }));
    });

    // Total Row
    tableRows.push(new TableRow({
        children: [
            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "TOTAL", bold: true })] })] }),
            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: total.toLocaleString() + " KES", bold: true })] })] }),
        ],
    }));

    const doc = new Document({
        sections: [{
            children: [
                new Paragraph({ text: "INVOICE", heading: "Heading1", alignment: AlignmentType.CENTER }),
                new Paragraph({ text: "Date: " + new Date().toLocaleDateString() }),
                new Paragraph({ text: "" }),
                new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: tableRows }),
            ],
        }],
    });

    Packer.toBlob(doc).then(blob => {
        saveAs(blob, `Invoice_${Date.now()}.docx`);
        moveTasksToHistory();
    });
}

async function moveTasksToHistory() {
    if (!currentEmployerId) return;

    // We change status to 'Paid' so they move to the History tab
    const { error } = await supabaseClient
        .from('tasks')
        .update({ status: 'Paid' })
        .eq('employer_id', currentEmployerId)
        .eq('status', 'Done');

    if (error) {
        console.error("Error archiving tasks:", error.message);
    } else {
        alert("Invoice generated! Orders moved to History.");
        fetchTasks(); // Refresh UI
    }
}

setInterval(fetchTasks,60000);

window.onload = async () => {
    updateStatusUI();
    await loadEmployers();
    
    // Request notification permission
    if (Notification.permission !== 'granted') {
        Notification.requestPermission();
    }

    // CRITICAL: "Prime" the audio on the first click anywhere on the page
    document.body.addEventListener('click', () => {
        const alarm = document.getElementById('dueAlarm');
        alarm.muted = true; // Briefly mute to allow playback
        alarm.play().then(() => {
            alarm.pause();
            alarm.muted = false;
        });
    }, { once: true });
};

function updateDashboardTotals(tasks) {
    const pendingTotalEl = document.getElementById('pendingTotal');
    const doneTotalEl = document.getElementById('doneTotal');

    const pendingSum = tasks
        .filter(t => t.status === 'Pending')
        .reduce((sum, t) => sum + (parseFloat(t.payable) || 0), 0);

    const doneSum = tasks
        .filter(t => t.status === 'Done')
        .reduce((sum, t) => sum + (parseFloat(t.payable) || 0), 0);

    console.log("Math Check - Pending:", pendingSum, "Done:", doneSum);

    if (pendingTotalEl) {
        pendingTotalEl.innerText = pendingSum.toLocaleString('en-KE', { 
            minimumFractionDigits: 2, 
            maximumFractionDigits: 2 
        });
    }
    if (doneTotalEl) {
        doneTotalEl.innerText = doneSum.toLocaleString('en-KE', { 
            minimumFractionDigits: 2, 
            maximumFractionDigits: 2 
        });
    }
}

/** * REAL-TIME UI TICKER
 * Updates countdowns locally every second
 */
setInterval(() => {
    document.querySelectorAll('.time-countdown').forEach(cell => {
        const deadlineStr = cell.getAttribute('data-deadline');
        if (!deadlineStr) return;

        const diff = new Date(deadlineStr) - new Date();

        if (diff <= 0) {
            cell.innerText = "DUE NOW";
            cell.style.cssText = "color: #e74c3c; font-weight: bold; animation: blink 1s infinite;";
        } else {
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);

            cell.innerText = `${h}h ${m}m ${s}s`;
            // Visual cue: Orange if less than 1 hour remains
            cell.style.color = (h < 1) ? "#f39c12" : "inherit";
        }
    });
}, 1000);
</script>
</body>
</html>
